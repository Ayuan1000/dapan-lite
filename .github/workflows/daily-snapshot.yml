name: daily-snapshot

# 每交易日 17:45 (Asia/Shanghai = 09:45 UTC) 生成预选池快照并提交，
# 由 GitHub Pages 直接托管，替代 Netlify Scheduled Function + Blobs。
# 也支持在 Actions 页面手动触发（workflow_dispatch）补跑。
on:
  schedule:
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # lib/core.js 只依赖 Node 内置 fetch，无需 npm install
      - name: Generate snapshot
        run: node scripts/gen-snapshot.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: snapshot $(date -u +%Y%m%d-%H%M) UTC"
            git push
          fi
